name: cart-to-kitchen

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ctk
      POSTGRES_USER: ctk
      POSTGRES_PASSWORD: ${CTK_PG_PASSWORD:-ctk-local-only}
    volumes:
      - ctk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctk -d ctk"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"  # the URL the frontend .env expects
    environment:
      CTK_DATABASE_URL: postgresql+psycopg://ctk:${CTK_PG_PASSWORD:-ctk-local-only}@database:5432/ctk
      CTK_JWT_SECRET: ${CTK_JWT_SECRET:-ctk-local-development-secret-change-before-production}
      CTK_ALLOWED_ORIGINS: ${CTK_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ctk-postgres:
