name: sync-and-deploy
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: merge
        name: merge upstream main (auto-deploys frontend via Vercel)
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add upstream http://x-access-token:${{ secrets.UPSTREAM_TOKEN }}@github.com/kaffe1/Cart-to-Kitchen.git
          git fetch upstream main
          if git merge upstream/main --no-edit; then
            if git diff --quiet HEAD@{1} HEAD 2>/dev/null; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              git push
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git merge --abort
            echo "::warning::merge conflict with upstream — manual sync needed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
  deploy-backend:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rsync backend and rebuild docker stack
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null key
          echo "$KEY" > key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i key" --exclude '.venv' --exclude '__pycache__' --exclude '.pytest_cache' --exclude 'postman' backend/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/cart-to-kitchen/"
          ssh -i key "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/cart-to-kitchen && docker-compose up -d --build" 
        # DEPLOY_HOST / DEPLOY_USER come from repo secrets via env passthrough
        # (rsync/ssh read them from the environment in the runner)
    # secrets are exposed to the step environment automatically when referenced
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
