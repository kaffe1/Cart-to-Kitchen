name: sync-upstream
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: merge upstream main (auto-deploys frontend via Vercel)
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add upstream http://x-access-token:${{ secrets.UPSTREAM_TOKEN }}@github.com/kaffe1/Cart-to-Kitchen.git
          git fetch upstream main
          if git merge upstream/main --no-edit; then
            git push
          else
            git merge --abort
            echo "::warning::merge conflict with upstream — manual sync needed"
          fi
